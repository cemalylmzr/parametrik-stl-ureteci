<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
  <!-- İzometrik 3D CAD Küpü -->
  <polygon points="32,12 52,23 32,34 12,23" fill="url(#top)"/>
  <polygon points="12,23 32,34 32,53 12,42" fill="url(#left)"/>
  <polygon points="52,23 32,34 32,53 52,42" fill="url(#right)"/>
  <!-- İç bal peteği / delik detayı -->
  <polygon points="32,18 41,23 32,28 23,23" fill="#0b1220" opacity="0.75"/>
  <polyline points="12,23 32,34 52,23" fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-linejoin="round" opacity="0.85"/>
  <line x1="32" y1="34" x2="32" y2="53" stroke="#e0f2fe" stroke-width="1.6" opacity="0.75"/>
</svg>
